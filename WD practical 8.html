<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <style>
        body {
            text-align: center;
            background: linear-gradient(lightblue);
            font-family: Arial, sans-serif;
        }

        h2 {
            margin: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 30px; /* equal gap both sides */
            padding: 20px;
        }

        img {
            width: 200px;   /* ✅ standard size */
            height: 200px;  /* ✅ square images */
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        img:hover {
            transform: scale(1.1);
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <h2>My Image Gallery</h2>

    <div class="gallery">
        <img src="https://images.pexels.com/photos/9764171/pexels-photo-9764171.jpeg">
        <img src="https://images.pexels.com/photos/10585642/pexels-photo-10585642.jpeg">
        <img src="https://images.pexels.com/photos/10496423/pexels-photo-10496423.jpeg">
        <img src="https://images.pexels.com/photos/374059/pexels-photo-374059.jpeg">

        <img src="https://images.pexels.com/photos/11997156/pexels-photo-11997156.jpeg">
        <img src="https://images.pexels.com/photos/1650911/pexels-photo-1650911.jpeg">
        <img src="https://images.pexels.com/photos/29726970/pexels-photo-29726970.jpeg">
        <img src="https://images.pexels.com/photos/31298880/pexels-photo-31298880.jpeg">
    </div>

</body>
</html>
