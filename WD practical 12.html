
 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Page</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">My Website</a>
  </div>
</nav>

<!-- Carousel -->
<div id="demo" class="carousel slide" data-bs-ride="carousel">

  <div class="carousel-inner">

    <div class="carousel-item active">
      <img src="https://picsum.photos/1200/300?random=1"
           class="d-block w-100">
    </div>

    <div class="carousel-item">
      <img src="https://picsum.photos/1200/300?random=2"
           class="d-block w-100">
    </div>

  </div>

</div>

<!-- Cards -->
<div class="container mt-4">
  <div class="row">

    <div class="col-md-4">
      <div class="card">
        <img src="https://picsum.photos/300?random=3"
             class="card-img-top">
        <div class="card-body">
          <h5>Card 1</h5>
          <button class="btn btn-primary">Click</button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <img src="https://picsum.photos/300?random=4"
             class="card-img-top">
        <div class="card-body">
          <h5>Card 2</h5>
          <button class="btn btn-success">Click</button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card">
        <img src="https://picsum.photos/300?random=5"
             class="card-img-top">
        <div class="card-body">
          <h5>Card 3</h5>
          <button class="btn btn-danger">Click</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3 mt-4">
  Simple Bootstrap Page
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
