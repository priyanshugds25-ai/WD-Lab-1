<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML5 APIs Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    section {
      margin-bottom: 40px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    h2 {
      margin-top: 0;
    }

    /* Drag & Drop styles */
    #dragBox {
      width: 100px;
      height: 100px;
      background-color: steelblue;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }

    #dropZone {
      width: 200px;
      height: 200px;
      border: 2px dashed #aaa;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }

    button {
      margin-top: 10px;
      padding: 8px 12px;
    }
  </style>
</head>
<body>

  <h1>HTML5 APIs Demo</h1>

  <!-- Drag and Drop -->
  <section>
    <h2>Drag & Drop API</h2>
    <div id="dragBox" draggable="true">Drag me</div>
    <div id="dropZone">Drop here</div>
  </section>

  <!-- Geolocation -->
  <section>
    <h2>Geolocation API</h2>
    <button onclick="getLocation()">Get My Location</button>
    <p id="locationOutput"></p>
  </section>

  <!-- Web Storage -->
  <section>
    <h2>Web Storage API (localStorage)</h2>
    <input type="text" id="nameInput" placeholder="Enter your name">
    <button onclick="saveName()">Save</button>
    <button onclick="loadName()">Load</button>
    <p id="storageOutput"></p>
  </section>

  <script>
    /* ---------------- Drag & Drop ---------------- */
    const dragBox = document.getElementById("dragBox");
    const dropZone = document.getElementById("dropZone");

    dragBox.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", "dragBox");
    });

    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault(); // Allow drop
    });

    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      const data = e.dataTransfer.getData("text");
      const draggedElement = document.getElementById(data);
      dropZone.appendChild(draggedElement);
    });

    /* ---------------- Geolocation ---------------- */
    function getLocation() {
      const output = document.getElementById("locationOutput");

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            output.innerHTML = `
              Latitude: ${position.coords.latitude}<br>
              Longitude: ${position.coords.longitude}
            `;
          },
          () => {
            output.innerText = "Unable to retrieve your location.";
          }
        );
      } else {
        output.innerText = "Geolocation is not supported by your browser.";
      }
    }

    /* ---------------- Web Storage ---------------- */
    function saveName() {
      const name = document.getElementById("nameInput").value;
      localStorage.setItem("username", name);
      alert("Name saved!");
    }

    function loadName() {
      const name = localStorage.getItem("username");
      const output = document.getElementById("storageOutput");

      if (name) {
        output.innerText = "Stored Name: " + name;
      } else {
        output.innerText = "No name stored.";
      }
    }
  </script>

</body>
</html>
